name: Repository workflow policy

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  repository-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup CUE
        uses: cue-lang/setup-cue@v1.0.0
        with:
          version: v0.16.1

      - name: Validate shared state contracts
        run: cue vet -c=false ./contracts/state:state

      - name: Validate task worktree procedure
        run: bash scripts/test-create-task-worktree.sh
