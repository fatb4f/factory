name: Observatory validation

on:
  push:
    branches:
      - main
    paths:
      - "contracts/state/**"
      - "state/fixtures/**"
      - "scripts/repository_context.py"
      - "scripts/cue_model_introspection.py"
      - "scripts/generate_semantic_runtime_types.py"
      - "scripts/industrial_graph_snapshot.py"
      - "scripts/validate-observatory.sh"
      - "scripts/validate-observatory-introspection.sh"
      - "scripts/validate-ibis-introspection.sh"
      - "scripts/validate-observatory-rendering.sh"
      - "scripts/validate-marimo-adapter.sh"
      - "scripts/validate-industrial-workbook.sh"
      - "scripts/validate-observatory-v1.sh"
      - "scripts/validate-property-graph.sh"
      - ".github/workflows/observatory-validation.yml"
      - "runtime/**"
      - "world/industrial-signals/**"
  pull_request:
    paths:
      - "contracts/state/**"
      - "state/fixtures/**"
      - "scripts/repository_context.py"
      - "scripts/cue_model_introspection.py"
      - "scripts/generate_semantic_runtime_types.py"
      - "scripts/industrial_graph_snapshot.py"
      - "scripts/validate-observatory.sh"
      - "scripts/validate-observatory-introspection.sh"
      - "scripts/validate-ibis-introspection.sh"
      - "scripts/validate-observatory-rendering.sh"
      - "scripts/validate-marimo-adapter.sh"
      - "scripts/validate-industrial-workbook.sh"
      - "scripts/validate-observatory-v1.sh"
      - "scripts/validate-property-graph.sh"
      - "runtime/**"
      - "world/industrial-signals/**"

permissions:
  contents: read

jobs:
  validate-observatory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: cue-lang/setup-cue@v1.0.0
        with:
          version: v0.16.1
      - name: Validate Observatory V1 convergence
        run: bash scripts/validate-observatory-v1.sh
      - name: Validate Observatory semantic introspection
        run: bash scripts/validate-observatory-introspection.sh
      - name: Validate Analytics IR to Ibis introspection
        run: bash scripts/validate-ibis-introspection.sh
      - name: Install render validation Python runtimes
        run: python3 -m pip install --disable-pip-version-check "ibis-framework==12.0.0" "rich==15.0.0"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Structurizr validator
        run: |
          curl -fsSL "https://download.structurizr.com/structurizr-2026.06.28.war" -o "$RUNNER_TEMP/structurizr.war"
          test -s "$RUNNER_TEMP/structurizr.war"
          echo "STRUCTURIZR_WAR=$RUNNER_TEMP/structurizr.war" >> "$GITHUB_ENV"
      - name: Validate Observatory render projections
        run: bash scripts/validate-observatory-rendering.sh
      - name: Validate optional property-graph adapter
        run: bash scripts/validate-property-graph.sh
