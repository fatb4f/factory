[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "factory-review-desk-navigation"
version = "0.1.0"
requires-python = ">=3.12"

[project.entry-points."factory.transforms"]
"review-desk.links" = "factory_review_desk_navigation:linked_objects"

[tool.setuptools]
py-modules = ["factory_review_desk_navigation"]
