name: Contract and artifact validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup CUE
        uses: cue-lang/setup-cue@v1.0.0
        with:
          version: v0.16.1

      - name: Validate contracts, fixtures, and admitted artifacts
        run: bash scripts/validate-contracts.sh
