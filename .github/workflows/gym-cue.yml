name: Gym CUE semantic integrity

on:
  pull_request:
    paths:
      - "contracts/personal/gym/**"
      - "personal/gym/fixtures/**"
      - "cue.mod/module.cue"
      - ".github/workflows/gym-cue.yml"
  push:
    branches:
      - main
    paths:
      - "contracts/personal/gym/**"
      - "personal/gym/fixtures/**"
      - "cue.mod/module.cue"
      - ".github/workflows/gym-cue.yml"

permissions:
  contents: read

jobs:
  validate-gym:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup CUE
        uses: cue-lang/setup-cue@v1.0.0
        with:
          version: v0.16.1

      - name: Validate Gym contracts
        run: cue vet ./contracts/personal/gym

      - name: Validate Gym positive fixtures
        run: cue vet ./personal/gym/fixtures

      - name: Reject Gym negative fixtures
        run: bash personal/gym/fixtures/negative/run.sh
